# Speculum -- Alembic migration config.
#
# Production DB = PostgreSQL 16. Local dev / unit tests can use SQLite via
# SPECULUM_DATABASE_URL env var. env.py reads the env var first, falling back
# to sqlalchemy.url below.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Override at runtime with SPECULUM_DATABASE_URL. This placeholder is a
# fallback only.
sqlalchemy.url = postgresql+psycopg://speculum:speculum@localhost:5432/speculum
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
