[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speculum-server"
version = "0.1.0-dev"
description = "Speculum backend — Korean equity market quantitative inspector"
requires-python = ">=3.12"

# 본 파일은 M0 T0 scaffold 시점의 최소 선언. 의존성은 Phase 1 진입 시 보강.
# 자세한 dependency 정책은 docs/M0_PLAN.md §4.2 참조.
dependencies = [
  # Windows 환경에서 ZoneInfo("Asia/Seoul") 가 시스템 tzdb 없이 작동하도록.
  # Linux/Mac 은 OS tzdb 사용. Production 배포가 Linux Docker 면 stub 으로 무해.
  "tzdata>=2024.1; sys_platform == 'win32'",
  # T13 — PostgreSQL 16 (운영) + SQLite (단위 테스트 + 로컬 dev 옵션).
  # SQLAlchemy 2.x sync ORM + Alembic migration.
  #
  # **sync repo 결정** (T13 결정): 기존 Repository Protocol (`pit_protocols.py`
  # 등) 이 모두 sync `def` 시그니처 — Fake 와 Protocol 변경 없이 SQL 구현체를
  # 드롭인. M0 single-user staging 에서 event loop block 은 허용 가능 trade-off.
  # M1+ 멀티-사용자 진입 시 async repo 전환을 단일 cycle 로 분리 (ARCHITECTURE.md
  # §3.1 의 "(Async)" 표기는 M1+ 의 의도 — 본 cycle 은 M0 scope).
  #
  # psycopg[binary] = sync PG driver (SQLAlchemy 2 호환). M0 의 일배치도 sync.
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  # T15 — Data Source Adapter (pykrx primary). pykrx 는 sync API + KRX 페이지
  # 크롤링 + pandas DataFrame 반환. ADR-0003 D6 의 rate limit / circuit
  # breaker 는 adapter 의 호출자 책임 (T18 일배치).
  "pykrx>=1.0,<2.0",
  "pandas>=2.0,<3.0",
  # T14 — FDR adapter (verify 출처). pykrx 와 cross-check (ADR-0001 D3 /
  # ADR-0003 D4). 외부 source (Yahoo / Naver) wrap 라 신뢰성은 pykrx 보다 낮음.
  "finance-datareader>=0.9,<1.0",
  # T16 — DART OpenAPI httpx client. FastAPI starlette 가 이미 의존하나 본
  # 패키지의 직접 사용을 위해 명시 declare (semver pin 안정성).
  "httpx>=0.27,<1.0",
  # 웹 serving — 앱이 직접 import 하는 FastAPI + Pydantic v2 schemas + uvicorn
  # ASGI 서버. M0 scaffold 시점엔 미선언이었으나 (transitive 설치 의존) 직접
  # 의존이므로 명시 declare. uvicorn 은 로컬 dev / 데모 실행
  # (`python -m scripts.seed_demo` + `uvicorn app.main:app`) 에 필요.
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  # .env 로드 (app/core/config.py 가 startup 에 호출). DART_API_KEY 등 로컬
  # 시크릿을 set/setx 대신 repo 루트 .env 에 둘 수 있게.
  "python-dotenv>=1.0,<2.0",
  # T68 — NextAuth JWT 검증 (HS256). AUTH_SECRET 설정 시 Authorization Bearer
  # JWT 를 PyJWT 로 decode (서명·만료 검증). AUTH_SECRET 미설정(개발/CI/테스트
  # 기본)이면 import 만 되고 호출 경로 없음 — SYSTEM_USER_ID fallback 유지.
  "pyjwt>=2.8,<3.0",
]

[project.optional-dependencies]
# 단위 테스트. 운영 image 에는 포함 X.
test = [
  "pytest>=8.0,<9.0",
]

# ADR-0031 D6 — 운영 LLM 공시 사실추출(AnthropicFactExtractor). 선택 의존:
# ANTHROPIC_API_KEY 설정 + 운영 노출(§2.7 경계 + ADR-0006 자문) 시에만 설치.
# 게이트/스키마/디스클레이머 파이프라인은 본 패키지 없이도 동작(fake 로 검증)하므로
# 기본 의존에서 분리한다 — 단위 테스트는 client= 주입으로 SDK 없이 통과.
llm = [
  "anthropic>=0.40,<1.0",
]

# 패키지 discovery 명시 — flat-layout(server/ 에 app/batch/scripts/alembic 공존)
# 에서 setuptools 자동 탐색이 "multiple top-level packages" 로 거부하므로 명시.
# app/batch/scripts 는 import 대상 패키지(__init__.py 보유). alembic 은 migration
# 디렉토리(패키지 아님, alembic CLI 가 cwd 에서 직접 읽음) + tests 는 설치 제외.
[tool.setuptools.packages.find]
include = ["app*", "batch*", "scripts*"]
exclude = ["tests*", "alembic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Speculum 의 모든 단위 테스트는 외부 의존 없이 작동해야 함 — Adapter 의 외부 호출은
# integration/ 디렉토리에 별도 분리 (ADR-0003 D8).
markers = [
  "integration: 외부 출처 호출이 필요한 통합 테스트 (CI 야간만)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 의도적으로 보수적 선택 — M0 단계에서 lint 폭증 방지.
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = [
  "E501",   # line-length — formatter 책임.
  # Domain 의도적 명명 — N818 의 "Error suffix" 강제는 factor_pack 의
  # IdentityViolation 같은 의미상 명사형 도메인 예외에 부적합.
  "N818",
  # str + Enum 다중 상속 — Python 3.11+ 의 StrEnum 마이그레이션은 별도 cycle.
  # ADR-0007 / ADR-0002 의 enum 정의가 현재 패턴 의존.
  "UP042",
  # Generic class — Python 3.12 PEP 695 syntax 도입은 점진적. M0 = legacy 유지.
  "UP046",
  # Sessionmaker 같은 SQLAlchemy convention 변수명 — N806/N802 의 PEP-8 와 불일치.
  "N802",
  "N806",
  # `_fdr` 같은 의도적 namespace import — ADR-0003 의 adapter 별 명명.
  "N813",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
