# Speculum server CI — pytest + ruff.
#
# M0_PLAN T41 의 backend 통합. 매 push/PR 마다 server 의 unit test + lint
# 회귀를 자동 차단. integration test (외부 출처 호출) 는 본 workflow 미포함
# — pyproject.toml 의 `integration` marker 가 별도 야간 CI 대상 (ADR-0003 D8).
#
# 의존성:
#   - Python 3.12 (pyproject.toml `requires-python`)
#   - pip install -e .[test]  → sqlalchemy/pykrx/httpx 등 deps + pytest
#
# 관련 ADR / 문서:
# - ADR-0003 D8 (Adapter 의 외부 호출은 integration 마커)
# - M0_PLAN T41 / AC-P-04 (PIT bypass) — pytest 회귀가 PIT Enforcer 검증

name: server-ci

on:
  push:
    branches: [develop, main]
    paths:
      - "server/**"
      - "tools/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "tools/**"
      - ".github/workflows/server-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/pyproject.toml

      - name: Install
        # editable install + test extras (pytest).
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Ruff lint
        # pyproject.toml 의 tool.ruff 설정 — E/F/W/I/N/B/UP rule set.
        run: |
          python -m pip install "ruff>=0.7,<1.0"
          ruff check .

      - name: Pytest (unit only — integration marker 제외)
        # ADR-0003 D8 — 외부 호출 integration 은 야간 CI. CI 의 default 는
        # `-m "not integration"` 로 빠른 unit test 만.
        run: pytest -m "not integration"
