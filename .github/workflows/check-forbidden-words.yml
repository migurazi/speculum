# ADR-0007 §D4 — 금지 어휘 CI 게이트.
#
# 모든 push / PR 에 대해 source code / 콘텐츠 파일을 스캔하여 금지 어휘
# 등장 시 fail. shared/forbidden-words.json 의 단일 정의를 file-system level
# 강제.
#
# 의존성: Python 3.12 만 — server 의 sqlalchemy/httpx 등 deps 미설치 필요.
# scan_text 는 standalone module (forbidden_words.py + 표준 라이브러리).
#
# 관련 ADR / 문서:
# - ADR-0007 §D4 (정책), §D9 (변경 절차)
# - M0_PLAN T29 / AC-P-02 (금지 어휘 0)

name: check-forbidden-words

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run forbidden words scanner
        run: python tools/check_forbidden_words.py .
